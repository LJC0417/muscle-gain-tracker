name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:        # 手动触发（推荐）
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.22.x (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install Android SDK Platform 35
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"
          ls "$ANDROID_HOME/platforms" | grep android-35

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Drift code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run flutter analyze (errors fatal)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests (hard gate)
        run: flutter test --no-pub --reporter=expanded

      - name: Build release APK (arm64-v8a)
        run: |
          set -o pipefail
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --split-per-abi 2>&1 | tee /tmp/apk_build.log | tail -n 8

      - name: Report build errors (public annotations)
        if: failure()
        run: |
          echo "===== last 40 lines ====="
          tail -n 40 /tmp/apk_build.log || true
          echo "===== what went wrong ====="
          awk '/What went wrong/{f=1;next} f&&n<25{print;n++}' /tmp/apk_build.log || true
          # Primary: the "What went wrong" section verbatim (contains the real cause)
          awk '/What went wrong/{f=1;next} f&&n<16{print;n++}' /tmp/apk_build.log | cut -c1-380 > /tmp/errs.txt || true
          # Fallback: raw tail lines
          if [ ! -s /tmp/errs.txt ]; then
            tail -n 14 /tmp/apk_build.log | cut -c1-300 > /tmp/errs.txt
          fi
          while IFS= read -r line; do echo "::error::$line"; done < /tmp/errs.txt

      - name: Verify APK exists
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            || (echo "::error::app-arm64-v8a-release.apk not found" && exit 1)

      - name: Stage APK artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             artifacts/muscle-gain-tracker-arm64-v8a-release.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muscle-gain-tracker-arm64-v8a
          path: artifacts/muscle-gain-tracker-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30