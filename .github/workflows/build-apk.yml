name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:        # 手动触发（推荐）
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.22.x (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android platform files (flutter create)
        run: flutter create --platforms=android --org com.ljc --project-name muscle_gain_tracker .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Drift code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run flutter analyze (informational)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings || true

      - name: Run unit tests
        run: flutter test --no-pub --reporter=expanded || true

      - name: Build release APK (arm64-v8a)
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --split-per-abi

      - name: Verify APK exists
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            || (echo "::error::app-arm64-v8a-release.apk not found" && exit 1)

      - name: Stage APK artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             artifacts/muscle-gain-tracker-arm64-v8a-release.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muscle-gain-tracker-arm64-v8a
          path: artifacts/muscle-gain-tracker-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30